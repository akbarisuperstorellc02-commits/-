name: Build Zahra app with in-app offline AI download

on:
  workflow_dispatch:
  push:
    branches:
      - work/zahra-hybrid-foundation
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

concurrency:
  group: zahra-in-app-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare trusted model manifest (model is NOT bundled in the app)
        shell: bash
        run: |
          set -euo pipefail
          MODEL_URL="https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm"
          mkdir -p app/src/main/assets
          curl --fail --location --retry 5 --retry-delay 4 "$MODEL_URL" -o /tmp/gemma-4-E2B-it.litertlm
          MODEL_BYTES="$(stat -c%s /tmp/gemma-4-E2B-it.litertlm)"
          MODEL_SHA="$(sha256sum /tmp/gemma-4-E2B-it.litertlm | cut -d ' ' -f1)"
          test "$MODEL_BYTES" -gt 2000000000
          printf '%s\n%s\n' "$MODEL_SHA" "$MODEL_BYTES" > app/src/main/assets/gemma4.manifest
          echo "Model manifest prepared: bytes=$MODEL_BYTES sha256=$MODEL_SHA"
          rm -f /tmp/gemma-4-E2B-it.litertlm
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate Android debug keystore
        shell: bash
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build Android APK and App Bundle
        run: gradle :app:assembleDebug :app:bundleDebug --stacktrace
      - name: Upload phone-installable APK
        uses: actions/upload-artifact@v4
        with:
          name: zahra-app-apk-in-app-ai
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          retention-days: 7
      - name: Upload Google Play App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: zahra-google-play-aab-in-app-ai
          path: app/build/outputs/bundle/debug/app-debug.aab
          compression-level: 0
          retention-days: 7
